services:
  # OpenDify 代理服务
  opendify:
    build: .
    container_name: opendify-proxy
    restart: unless-stopped
    
    # 端口映射：将容器的服务端口映射到主机端口
    ports:
      - "${EXTERNAL_PORT:-5068}:${SERVER_PORT:-5000}"
    
    # 环境变量由 .env 提供
    # 卷挂载：用于持久化配置和日志
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env  # 挂载环境变量文件，支持后台写入并热加载
    
    # 网络配置
    networks:
      - opendify-network
    
    # 健康检查配置
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-5000}/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # 标签
    labels:
      - "com.opendify.description=OpenDify API Proxy"
      - "com.opendify.version=1.0"

# 网络配置
networks:
  opendify-network:
    driver: bridge
    name: opendify-network

# 卷配置
volumes:
  logs:
    driver: local
